<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Resultados — Simulacros | I.E. San Luis Gonzaga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4/build/index.umd.min.js"></script>
<style>
  :root{
    --ink:#201f24;
    --muted:#6f6a63;
    --paper:#f6f1e8;
    --surface:#ffffff;
    --border:#e4ddcd;
    --red:#c40016;
    --red-deep:#8f0010;
    --gold:#c9a24b;
    --gold-light:#e8d5a8;
    --board:#1e2b26;
    --board-line:rgba(232,213,168,0.22);
    --green:#1a7f37;
    --shadow: 0 4px 16px rgba(32,31,36,0.08);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Lora', serif; margin:0; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  a{ color:var(--red); }
  :focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

  /* ---------- Header ---------- */
  header.masthead{
    background: linear-gradient(180deg, #ffffff 0%, #fbf8f2 100%);
    border-bottom:1px solid var(--border);
  }
  .ribbon{ height:10px; background: linear-gradient(90deg, var(--gold) 0%, var(--red) 100%); }
  .masthead-inner{
    max-width:1180px; margin:0 auto; padding:26px 28px 22px;
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  }
  .masthead-logos{ display:flex; align-items:center; gap:16px; flex-shrink:0; }
  .masthead-logos img{ width:56px; height:auto; display:block; transition:opacity .15s; }
  .masthead-logos a:hover img{ opacity:0.8; }
  .masthead-logo-divider{ width:1px; height:40px; background:var(--border); }
  .masthead-title{ flex:1; min-width:240px; }
  .masthead-title .eyebrow{
    text-transform:uppercase; letter-spacing:0.14em; font-size:11px; font-weight:700;
    color:var(--red); margin-bottom:4px;
  }
  .masthead-title h1{ font-size:26px; font-weight:700; color:var(--ink); line-height:1.2; }
  .masthead-title p{ margin:6px 0 0; color:var(--muted); font-size:14.5px; }
  .masthead-meta{
    display:flex; flex-direction:column; align-items:flex-end; gap:6px; font-size:12.5px; color:var(--muted);
  }
  .pill{
    display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:6px 12px; font-size:12.5px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--muted); }
  .dot.ok{ background:var(--green); }
  .dot.warn{ background:var(--red); }
  button.ghost{
    border:1px solid var(--border); background:var(--surface); color:var(--ink);
    padding:7px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer;
    font-family:'Inter', sans-serif; transition:border-color .15s, transform .1s;
  }
  button.ghost:hover{ border-color:var(--gold); }
  button.ghost:active{ transform:translateY(1px); }
  button.primary{
    border:none; background:var(--red); color:#fff;
    padding:9px 18px; border-radius:8px; font-size:13.5px; font-weight:700; cursor:pointer;
    font-family:'Inter', sans-serif; box-shadow:0 3px 10px rgba(196,0,22,0.25);
  }
  button.primary:hover{ background:var(--red-deep); }

  main{ max-width:1180px; margin:0 auto; padding:28px 28px 60px; }

  /* ---------- Setup / empty state ---------- */
  .setup-card{
    background:var(--surface); border:1px solid var(--border); border-left:6px solid var(--gold);
    border-radius:12px; padding:22px 24px; margin-bottom:26px; box-shadow:var(--shadow);
  }
  .setup-card h2{ font-size:18px; color:var(--red); margin-bottom:10px; }
  .setup-card ol{ margin:10px 0 0; padding-left:20px; line-height:1.75; font-size:14.5px; }
  .setup-card code{
    background:#f2ede1; padding:2px 6px; border-radius:5px; font-family:'JetBrains Mono', monospace; font-size:12.5px;
  }
  .setup-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .setup-row input[type=text]{
    flex:1; min-width:240px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:13.5px;
    font-family:'JetBrains Mono', monospace;
  }

  /* ---------- Filter bar ---------- */
  .filterbar{
    display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:16px 18px; margin-bottom:22px; box-shadow:var(--shadow);
  }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .field select{
    padding:9px 32px 9px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px;
    font-family:'Inter', sans-serif; background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%236f6a63"/></svg>') no-repeat right 12px center;
    appearance:none; min-width:170px; cursor:pointer;
  }
  .filterbar .spacer{ flex:1; }

  /* ---------- KPI cards ---------- */
  .kpi-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; margin-bottom:26px;
  }
  .kpi-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px;
    box-shadow:var(--shadow);
  }
  .kpi-card .label{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
  .kpi-card .value{ font-family:'JetBrains Mono', monospace; font-size:30px; font-weight:700; margin-top:8px; color:var(--ink); }
  .kpi-card .sub{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .kpi-card .sub.up{ color:var(--green); font-weight:700; }
  .kpi-card .sub.down{ color:var(--red); font-weight:700; }

  /* ---------- Section shells ---------- */
  .section{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:22px 24px; margin-bottom:22px; box-shadow:var(--shadow);
  }
  .section h2{ font-size:18px; color:var(--red); margin-bottom:4px; }
  .section .section-sub{ font-size:13px; color:var(--muted); margin-bottom:16px; }
  .chart-grid{ display:grid; grid-template-columns:1.15fr 1fr; gap:18px; }
  .chart-grid.single{ grid-template-columns:1fr; }
  .chart-grid.niveles-flex{ grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:22px 20px; }
  .chart-grid.niveles-flex-pair{ grid-template-columns:repeat(2, 1fr); }
  @media (max-width:700px){ .chart-grid.niveles-flex-pair{ grid-template-columns:1fr; } }

  .niveles-slider-hint{ display:none; font-size:11.5px; color:var(--muted); text-align:center; margin:0 0 10px; }
  .niveles-slider{
    display:flex; gap:20px; overflow-x:auto; scroll-snap-type:x mandatory;
    padding-bottom:10px; -webkit-overflow-scrolling:touch;
  }
  .niveles-slider::-webkit-scrollbar{ height:6px; }
  .niveles-slider::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  .niveles-slide{ flex:0 0 100%; scroll-snap-align:start; min-width:0; }
  .niveles-slide-subtitle{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    color:var(--muted); text-align:center; margin-bottom:4px;
  }
  @media (min-width:700px){
    .niveles-slide{ flex:0 0 calc(50% - 10px); }
    .niveles-slider-hint{ display:none !important; }
  }
  @media (max-width:699px){
    .niveles-slider-hint{ display:block; }
  }
  .chart-box.small{ height:280px; }
  .niveles-legend{ display:flex; flex-wrap:wrap; gap:4px 16px; margin:8px 0 14px; }
  .niveles-legend .item{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); }
  .niveles-legend .swatch{ width:10px; height:10px; border-radius:2px; display:inline-block; }
  .view-toggle{ display:none; gap:6px; margin:8px 0 4px; }
  .view-toggle.visible{ display:flex; }
  .view-toggle button{
    font-size:11.5px; padding:4px 11px; border:1px solid var(--border); background:var(--surface);
    border-radius:999px; cursor:pointer; color:var(--muted); font-family:'Inter', sans-serif; font-weight:600;
    transition:background .12s, color .12s, border-color .12s;
  }
  .view-toggle button:hover{ border-color:var(--gold); }
  .view-toggle button.active{ background:var(--red); color:#fff; border-color:var(--red); }
  .chart-box{ position:relative; height:320px; }

  /* ---------- Honor board (signature element) ---------- */
  .honor-board{
    background: radial-gradient(120% 140% at 10% 0%, #24352f 0%, var(--board) 55%);
    border-radius:14px; padding:26px 26px 10px; color:var(--gold-light); position:relative; overflow:hidden;
  }
  .honor-board::before{
    content:""; position:absolute; top:0; left:0; right:0; height:6px;
    background:linear-gradient(90deg, var(--gold), var(--red));
  }
  .honor-board h2{ color:var(--gold-light); font-size:19px; }
  .honor-board .section-sub{ color:rgba(232,213,168,0.65); }
  .honor-list{ margin-top:10px; }
  .honor-columns{ display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:6px; }
  .honor-columns.single{ grid-template-columns:1fr; }
  .honor-col-title{
    font-family:'Lora', serif; font-size:13.5px; color:var(--gold-light); opacity:0.9;
    text-transform:uppercase; letter-spacing:.05em; margin:0 0 4px; font-weight:600;
  }
  .honor-list.scroll{ max-height:460px; overflow-y:auto; padding-right:8px; }
  .honor-list.scroll::-webkit-scrollbar{ width:6px; }
  .honor-list.scroll::-webkit-scrollbar-thumb{ background:var(--board-line); border-radius:4px; }
  @media (max-width:700px){ .honor-columns{ grid-template-columns:1fr; } }
  .honor-item{
    display:flex; align-items:center; gap:16px; padding:13px 0;
    border-bottom:1px dashed var(--board-line);
  }
  .honor-item:last-child{ border-bottom:none; }
  .medal{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Lora', serif; font-weight:700; font-size:16px;
    border:1.5px solid var(--board-line); color:var(--gold-light);
  }
  .medal.m1{ background:linear-gradient(150deg,#f3d78a,var(--gold)); color:#3a2a05; border:none; }
  .medal.m2{ background:linear-gradient(150deg,#e7e7ea,#b9b9c2); color:#2c2c33; border:none; }
  .medal.m3{ background:linear-gradient(150deg,#d99a63,#b06a34); color:#2c1c0c; border:none; }
  .honor-name{ flex:1; min-width:0; }
  .honor-name .grupo{ font-weight:700; font-size:15px; color:#fff; }
  .honor-name .director{ font-size:12.5px; color:rgba(232,213,168,0.6); margin-top:2px; }
  .honor-score{ text-align:right; }
  .honor-score .val{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:18px; color:var(--gold-light); }
  .honor-score .delta{ font-size:12px; margin-top:2px; }
  .honor-score .delta.up{ color:#7fd99a; }
  .honor-score .delta.down{ color:#f19a9a; }

  /* ---------- Table ---------- */
  table.results{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.results th{
    text-align:left; background:#f9f5ec; color:var(--ink); font-size:11.5px; text-transform:uppercase;
    letter-spacing:.04em; padding:10px 12px; border-bottom:2px solid var(--border); cursor:pointer; user-select:none;
    white-space:nowrap;
  }
  table.results th span.arrow{ color:var(--gold); margin-left:4px; }
  table.results td{ padding:10px 12px; border-bottom:1px solid var(--border); }
  table.results tbody tr:hover{ background:#fbf8f2; }
  table.results td.num{ font-family:'JetBrains Mono', monospace; text-align:right; }
  .badge-grado{
    display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
    background:#f2ede1; color:var(--muted);
  }
  .delta-chip{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12.5px; }
  .delta-chip.up{ color:var(--green); }
  .delta-chip.down{ color:var(--red); }
  .delta-chip.flat{ color:var(--muted); }

  footer{ text-align:center; padding:24px; font-size:12.5px; color:var(--muted); }

  .facimate-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:16px; margin-bottom:22px; box-shadow:var(--shadow); text-align:center;
  }
  .facimate-banner{ max-width:100%; height:auto; border-radius:8px; display:block; margin:0 auto; }
  .facimate-card a{ text-decoration:none; }

  @media (max-width:860px){
    .kpi-grid{ grid-template-columns:repeat(2,1fr); }
    .chart-grid{ grid-template-columns:1fr; }
    .masthead-meta{ align-items:flex-start; }
    table.results{ font-size:12.5px; }
  }
</style>
</head>
